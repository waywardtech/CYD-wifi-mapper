; CYD Wi-Fi Mapper — PlatformIO configuration
; Board: ESP32-2432S028R ("Cheap Yellow Display")
[platformio]
default_envs = cyd

[env]
test_framework = unity

[cyd_common]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = huge_app.csv
extra_scripts = pre:tools/embed_web.py
test_ignore = *
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    bblanchon/ArduinoJson@^7.2.0
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DARDUINOJSON_ENABLE_STD_STRING=1
    -DUSER_SETUP_LOADED=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DUSE_HSPI_PORT=1
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DSPI_FREQUENCY=55000000
    -DSPI_READ_FREQUENCY=20000000

; Original single micro-USB board (ILI9341)
[env:cyd]
extends = cyd_common
build_flags =
    ${cyd_common.build_flags}
    -DILI9341_2_DRIVER=1

; Two-USB variant (ST7789, needs inversion off + BGR)
[env:cyd2usb]
extends = cyd_common
build_flags =
    ${cyd_common.build_flags}
    -DST7789_DRIVER=1
    -DTFT_RGB_ORDER=TFT_BGR
    -DTFT_INVERSION_OFF=1

; Host build: unit tests for the portable core (pio test -e native)
[env:native]
platform = native
build_flags = -std=gnu++17 -DWM_HOST=1
lib_deps = bblanchon/ArduinoJson@^7.2.0
lib_compat_mode = off
