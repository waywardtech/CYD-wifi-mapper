<!-- Device emulator: appended to index.html by tools/build_artifact.py to make the standalone
     "full app" page. Runs the firmware's UI code (lib/core, compiled to WebAssembly) on a canvas.
     Relies on `store` and `h` from the setup app's script. -->
<style>
  #tabs { display:flex; gap:8px; padding:10px 14px 0; max-width:980px; margin:0 auto; }
  #tabs button { border-bottom:none; border-radius:3px 3px 0 0; padding:8px 18px; letter-spacing:.06em; }
  #emu { padding:14px; max-width:980px; margin:0 auto; }
  #bezel { background:#e9bd0c; border-radius:10px; padding:14px 14px 18px; width:min(100%, 700px); box-shadow:inset 0 0 0 2px #b8930a; }
  #bezel canvas { height:auto; min-height:0; aspect-ratio:4/3; border:3px solid #1a1a1a; border-radius:2px; cursor:pointer; }
  #bezel small { display:block; margin-top:8px; color:#3a2f00; font-size:11px; letter-spacing:.08em; }
  #emu .note { border-left:3px solid var(--amber); padding:2px 0 2px 12px; margin:14px 0; max-width:700px; }
</style>
<script>
'use strict';
(function () {
  const WASM_B64 = '__WASM_B64__';
  const DEMO = __DEMO_JSON__;
  const W = 320, H = 240, S = 3;
  const mainEl = document.querySelector('main');
  const cv = h('canvas', { width: W * S, height: H * S, 'aria-label': 'CYD touch screen (320 by 240)' });
  const status = h('p', { class: 'small', role: 'status' }, 'Starting…');
  const emu = h('div', { id: 'emu' },
    h('div', { id: 'bezel' }, cv, h('small', {}, 'ESP32-2432S028R · CHEAP YELLOW DISPLAY · EMULATED')),
    h('p', { class: 'note' }, h('b', {}, 'The radio is simulated. '), 'A browser cannot scan Wi-Fi, so BIND and SCAN HERE use a simple model: every router and mesh node you place transmits, and walls and floors weaken it. Everything else is the real device software. Measurements taken on an actual CYD can be imported in SETUP and viewed here.'),
    h('p', { class: 'small' }, 'Tap and drag on the screen as you would with a finger. Drag rotates the model in ISO and pans it in 2D. Start in PLACE: switch to 2D, ADD, tap a spot; then SURVEY: tap where you stand, SCAN HERE; then VIEW.'),
    status);
  const tabDev = h('button', { onclick: () => show('device') }, 'DEVICE'), tabSet = h('button', { onclick: () => show('setup') }, 'SETUP');
  mainEl.before(h('nav', { id: 'tabs', 'aria-label': 'Sections' }, tabDev, tabSet));
  mainEl.after(emu);

  let ex = null, visible = 'device', parked = new Uint8Array(0);
  function show(which) {
    visible = which;
    emu.style.display = which === 'device' ? '' : 'none';
    mainEl.style.display = which === 'setup' ? '' : 'none';
    tabDev.className = which === 'device' ? 'on' : ''; tabSet.className = which === 'setup' ? 'on' : '';
    tabDev.setAttribute('aria-pressed', which === 'device'); tabSet.setAttribute('aria-pressed', which === 'setup');
    // back from SETUP: reload the scan set list unless the device is waiting on its hotspot screen
    if (which === 'device' && ex && ex.wm_screen() !== 2) ex.wm_init();
    if (which === 'setup') viewHome().catch(fail);   // the device may have added scan sets or samples
  }

  const ctx = cv.getContext('2d'), enc = new TextEncoder(), dec = new TextDecoder();
  const col = c => 'rgb(' + (((c >> 11) & 31) * 255 / 31 | 0) + ',' + (((c >> 5) & 63) * 255 / 63 | 0) + ',' + ((c & 31) * 255 / 31 | 0) + ')';
  const str = (p, n) => dec.decode(new Uint8Array(ex.memory.buffer, p, n));
  const font = size => (size === 1 ? 8 * S : 12 * S) + 'px ui-monospace, Menlo, Consolas, "DejaVu Sans Mono", monospace';
  const park = text => { if (text == null) return -1; parked = enc.encode(text); return parked.length; };
  const slugs = () => store.keys().filter(k => k.startsWith('wm:/wifimap/') && k.endsWith('/project.json')).map(k => k.split('/')[2]).sort();
  ctx.textBaseline = 'top'; ctx.lineCap = 'square';

  const env = {
    js_fill_rect(x, y, w, hh, c) { ctx.fillStyle = col(c); ctx.fillRect(x * S, y * S, w * S, hh * S); },
    js_draw_rect(x, y, w, hh, c) { ctx.strokeStyle = col(c); ctx.lineWidth = S; ctx.strokeRect(x * S + S / 2, y * S + S / 2, (w - 1) * S, (hh - 1) * S); },
    js_line(a, b, c2, d, c) { ctx.strokeStyle = col(c); ctx.lineWidth = S; ctx.beginPath(); ctx.moveTo(a * S + S / 2, b * S + S / 2); ctx.lineTo(c2 * S + S / 2, d * S + S / 2); ctx.stroke(); },
    js_tri(a, b, c2, d, e, f, c) { ctx.fillStyle = ctx.strokeStyle = col(c); ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(a * S, b * S); ctx.lineTo(c2 * S, d * S); ctx.lineTo(e * S, f * S); ctx.closePath(); ctx.fill(); ctx.stroke(); },
    js_circle(x, y, r, c) { ctx.fillStyle = col(c); ctx.beginPath(); ctx.arc(x * S + S / 2, y * S + S / 2, (r + 0.5) * S, 0, 7); ctx.fill(); },
    js_text(x, y, p, n, c, size) { ctx.fillStyle = col(c); ctx.font = font(size); ctx.fillText(str(p, n), x * S, (y + (size === 1 ? 0 : 1)) * S); },
    js_text_w(p, n, size) { ctx.font = font(size); return Math.ceil(ctx.measureText(str(p, n)).width / S); },
    js_now() { return performance.now(); },
    js_epoch() { return Date.now() / 1000; },
    js_file_size(p, n) { return park(store.get('wm:' + str(p, n))); },
    js_list_size() { return park(slugs().join('\n')); },
    js_take(dst) { new Uint8Array(ex.memory.buffer, dst, parked.length).set(parked); },
    js_file_write(p, n, d, dn, append) { const k = 'wm:' + str(p, n), t = str(d, dn); store.set(k, append ? (store.get(k) || '') + t : t); },
    js_hotspot(on) { if (on) show('setup'); },
  };

  const pos = e => { const r = cv.getBoundingClientRect(); return [Math.max(0, Math.min(W - 1, (e.clientX - r.left) * W / r.width | 0)), Math.max(0, Math.min(H - 1, (e.clientY - r.top) * H / r.height | 0))]; };
  let held = false;
  cv.addEventListener('pointerdown', e => { if (!ex) return; cv.setPointerCapture(e.pointerId); held = true; const p = pos(e); ex.wm_touch(1, p[0], p[1]); e.preventDefault(); });
  cv.addEventListener('pointermove', e => { if (ex && held) { const p = pos(e); ex.wm_touch(1, p[0], p[1]); } });
  const lift = e => { if (ex && held) { held = false; const p = pos(e); ex.wm_touch(0, p[0], p[1]); } };
  cv.addEventListener('pointerup', lift); cv.addEventListener('pointercancel', lift);

  async function boot() {
    show('device');
    try {
      if (!slugs().length) store.set('wm:/wifimap/demo-house/project.json', JSON.stringify(DEMO));
      const bin = Uint8Array.from(atob(WASM_B64), c => c.charCodeAt(0));
      const wasi = new Proxy({}, { get: () => () => 0 });
      const { instance } = await WebAssembly.instantiate(bin, { env, wasi_snapshot_preview1: wasi });
      ex = instance.exports;
      if (ex._initialize) ex._initialize();
      ex.wm_init();
      status.textContent = 'Running. A demo house is loaded if you have no scan sets of your own yet.';
      const loop = () => { if (visible === 'device') ex.wm_frame(); requestAnimationFrame(loop); };
      loop();
      globalThis.WM_EMU = ex;
    } catch (e) {
      status.textContent = 'The device emulator could not start here (' + (e && e.message || e) + '). The SETUP tab still works.';
    }
  }
  boot();
})();
</script>
